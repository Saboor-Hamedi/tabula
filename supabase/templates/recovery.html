<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your Lumina Tabula password</title>
  </head>
  <body style="margin:0;padding:0;background-color:#F1F0EC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#18181B;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:36px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background-color:#FFFFFF;border:1px solid #E2E1DC;border-radius:5px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 18px;font-size:15px;font-weight:700;letter-spacing:-0.01em;color:#18181B;">
                  Lumina Tabula
                </p>
                <h1 style="margin:0 0 12px;font-size:20px;font-weight:600;line-height:1.3;color:#18181B;">
                  Reset your password
                </h1>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#52525B;">
                  We received a request to reset the password for your Lumina Tabula account. Click the button below to choose a new password.
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:10px 20px;background-color:#18181B;color:#FFFFFF;font-size:14px;font-weight:600;text-decoration:none;border-radius:5px;">
                    Reset Password
                  </a>
                </p>
                <p style="margin:0;font-size:12px;line-height:1.5;color:#71717A;">
                  If you did not request a password reset, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

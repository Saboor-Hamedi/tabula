<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tabula — chat with your CSV or Excel data. Private, in-browser analysis with charts, SQL, and Python. Your files never leave your device."
    />
    <meta name="author" content="Tabula" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="canonical" href="https://tabula.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tabula" />
    <meta property="og:title" content="Tabula — Chat with your data" />
    <meta
      property="og:description"
      content="Private, in-browser data analysis. Upload a CSV or Excel file and get charts, SQL insights, and Python plots — your files never leave your device."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tabula — private, in-browser data analysis" />
    <meta property="og:url" content="https://tabula.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tabula — Chat with your data" />
    <meta
      name="twitter:description"
      content="Private, in-browser data analysis. Your files never leave your device."
    />
    <meta name="twitter:image" content="/og.png" />
    <meta name="twitter:image:alt" content="Tabula — private, in-browser data analysis" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Tabula",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Private, in-browser data analysis for CSV and Excel workbooks. Chat with your data, run SQL and Python, and export charts and reports — files never leave your device.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tabula-theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {}
      })();
    </script>
    <title>Tabula — Chat with your data</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
